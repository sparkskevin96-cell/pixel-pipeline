# Tests on Linux + Windows; on main (or by hand) also builds the Windows app.
# Kept lean (minutes are free for this public repo, but it was private once and may be
# again): pushes only run on main (PRs cover branches), docs-only changes are skipped, a
# newer push cancels an older run, and the exe is only built for main / manual runs.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", ".gitignore", "mobile/**", "web/**", ".github/workflows/android.yml"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", ".gitignore", "mobile/**", "web/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen  # headless Qt for the UI test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: python -m pip install -e ".[dev,ui,cutout,mcp,3d]"
      - name: Test
        run: python -X faulthandler -m pytest -v -p no:cacheprovider

  build-windows:
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write  # publishes the windows-latest pre-release
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install ".[ui,cutout,3d,build]"
      # The app compares this with version.json on the release to know when to update.
      - name: Build number
        run: |
          [ordered]@{ number = [int]$env:GITHUB_RUN_NUMBER; sha = $env:GITHUB_SHA
                      date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ") } |
            ConvertTo-Json | Set-Content src/pixel_pipeline/ui/build.json
          Copy-Item src/pixel_pipeline/ui/build.json version.json
          Get-Content version.json
      - name: Build (PyInstaller)
        run: pyinstaller packaging/pixel-pipeline.spec --noconfirm
      - name: Smoke test
        env:
          REMBG_HOME: ${{ runner.temp }}\rembg
          # no QT_QPA_PLATFORM=offscreen here: the app starts with the real Windows plugin,
          # like on a laptop
        run: |
          $app = "./dist/PixelPipeline"
          function Check($what) { if ($LASTEXITCODE -ne 0) { throw "$what failed ($LASTEXITCODE)" } }

          & "$app/pixel-pipeline.exe" --help; Check "--help"
          python -c "from PIL import Image, ImageDraw; im = Image.new('RGB', (320, 240), (70, 130, 200)); ImageDraw.Draw(im).ellipse((90, 50, 230, 210), fill=(220, 120, 40)); im.save('smoke.png')"
          & "$app/pixel-pipeline.exe" convert smoke.png --no-bg-removal -o smoke-plain.png; Check "convert"
          # Background removal with the 5 MB u2netp model proves onnxruntime is bundled.
          & "$app/pixel-pipeline.exe" convert smoke.png --bg-removal --model u2netp -o smoke-cutout.png; Check "convert --bg-removal"
          # 3D: trimesh (still model) and the glTF animation reader, map tiles and teams (demo).
          python -c "import trimesh; trimesh.creation.box(extents=[0.5, 1, 0.3]).export('box.glb')"
          & "$app/pixel-pipeline.exe" turnaround box.glb -o smoke-dirs.png --directions 4 -W 24 -H 24 --godot; Check "turnaround"
          & "$app/pixel-pipeline.exe" demo -o smoke-demo --directions 4 --frames 2 -W 24 -H 24; Check "demo"
          # Online providers load (no keys here, so it only reports that).
          & "$app/pixel-pipeline.exe" ai --balance --providers pixellab,retrodiffusion; Check "ai --balance"

          # Desktop app: opens the window, visits every tab, makes tiles and a Godot demo, quits
          # (see packaging/gui_main.py).
          $env:PIXEL_PIPELINE_SMOKE_TEST = "3"
          $p = Start-Process "$app/PixelPipeline.exe" -PassThru
          $null = $p.Handle  # keeps ExitCode readable after exit
          if (-not $p.WaitForExit(60000)) { $p | Stop-Process -Force; throw "desktop app hung" }
          if ($p.ExitCode -ne 0) {
            Get-Content smoke-test-error.txt -ErrorAction SilentlyContinue
            Get-Content "$env:LOCALAPPDATA\PixelPipeline\logs\faults.log" -ErrorAction SilentlyContinue
            throw "desktop app failed ($($p.ExitCode))"
          }
          "Bundle size: {0:N0} MB" -f ((Get-ChildItem $app -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)
      - name: Zip
        run: 7z a -tzip -mx=5 PixelPipeline-windows.zip ./dist/PixelPipeline
      # An older copy (build 0) updates itself from this zip like on a laptop, minus the
      # download: unpack, quit, the script swaps the files and restarts it with --updated.
      - name: Update test
        run: |
          $old = Join-Path $env:RUNNER_TEMP "OldCopy"
          Copy-Item ./dist/PixelPipeline $old -Recurse
          Set-Content "$old/_internal/pixel_pipeline/ui/build.json" '{"number": 0, "sha": "old", "date": ""}'
          $zip = (Resolve-Path PixelPipeline-windows.zip).Path
          $env:PIXEL_PIPELINE_UPDATE_TEST = $zip
          $p = Start-Process "$old/PixelPipeline.exe" -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(60000)) { $p | Stop-Process -Force; throw "old copy hung" }
          if ($p.ExitCode -ne 0) { Get-Content smoke-test-error.txt -EA SilentlyContinue; throw "old copy failed ($($p.ExitCode))" }
          for ($i = 0; $i -lt 120 -and -not (Test-Path "$zip.done"); $i++) { Start-Sleep 1 }
          Get-Content "$env:LOCALAPPDATA\PixelPipeline\logs\update.log" -EA SilentlyContinue | Select-Object -Last 15
          if (-not (Test-Path "$zip.done")) { Get-Content "$old/smoke-test-error.txt" -EA SilentlyContinue; throw "the updated app never started" }
          $said = (Get-Content "$zip.done").Trim()
          "The restarted app says: $said"
          if ($said -ne "--updated $env:GITHUB_RUN_NUMBER") { throw "expected --updated $env:GITHUB_RUN_NUMBER" }
      # One fixed download link that always has the newest build:
      #   https://github.com/<owner>/<repo>/releases/download/windows-latest/PixelPipeline-windows.zip
      - name: Publish the windows-latest pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete windows-latest --yes --cleanup-tag || true
          gh api -X DELETE "repos/$GH_REPO/git/refs/tags/windows-latest" 2>/dev/null || true
          gh release create windows-latest PixelPipeline-windows.zip version.json \
            --prerelease --target "$GITHUB_SHA" \
            --title "Pixel Pipeline for Windows, version $GITHUB_RUN_NUMBER" \
            --notes "Version $GITHUB_RUN_NUMBER of the desktop app (shown in its bottom-right corner), commit ${GITHUB_SHA::7}.

          Download PixelPipeline-windows.zip, right-click > Extract All, open the PixelPipeline folder and run PixelPipeline.exe. It isn't signed, so SmartScreen warns: More info > Run anyway. It offers to install itself (desktop icon) and then updates itself."
          # What the app's update check sees (through the API with a token, as for a private repo).
          python -c "import os; from pixel_pipeline.ui.updater import latest; r = latest(os.environ['GH_TOKEN'], repo=os.environ['GH_REPO']); print('The app sees', r.build.label, r.zip_size, 'bytes'); assert r.build.number == int(os.environ['GITHUB_RUN_NUMBER'])"
